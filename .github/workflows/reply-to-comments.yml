name: Reply to new comments
env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  DEFAULT_SYSTEM_PROMPT_NAME: "sama_bot_system_prompt"
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
  MLFLOW_EXPERIMENT_ID: ${{ secrets.MLFLOW_EXPERIMENT_ID }}
  MLFLOW_TRACKING_ENABLED: ${{ github.event.inputs.environment_type }}
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      mlflow_tracing_enabled:          
        description: 'MLflow tracing — set to true to enable (ai / bot commands)'
        required: true
        default: true
        type: choice
        options:
          - true
          - false
jobs:
  fetch-comments:
    runs-on: ubuntu-latest
    outputs:
      has_comments: ${{ steps.fetch.outputs.has_comments }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install yq
        run: pip install yq

      - name: Build tubectl
        run: go build -o tubectl .

      - name: Restore OAuth token
        run: |
          mkdir -p ~/.tubectl/auth
          echo "${{ secrets.TUBECTL_TOKEN }}" | base64 -d --ignore-garbage > ~/.tubectl/auth/youtube.json
          chmod 600 ~/.tubectl/auth/youtube.json

      - name: Cache transcripts
        uses: actions/cache@v4
        with:
          path: ~/.tubectl/transcripts
          key: transcripts-${{ hashFiles('registered_videos.yaml') }}
          restore-keys: |
            transcripts-

      - name: Fetch new comments
        id: fetch
        run: |
          SINCE=$(date -d '2 hours ago' --iso-8601=seconds)
          VIDEO_IDS=$(yq -r '.videos[]' registered_videos.yaml)

          echo '[]' > pending.json

          for VIDEO_ID in $VIDEO_IDS; do
            echo "Fetching comments for $VIDEO_ID (since $SINCE)..."

            ./tubectl video get-transcript --video-id "$VIDEO_ID" --language en || true

            ./tubectl video comments --video-id "$VIDEO_ID" --max-results 50 --order time > raw.json

            jq --arg v "$VIDEO_ID" --arg after "$SINCE" \
              '[.[] | select(.snippet.topLevelComment.snippet.publishedAt >= $after) | {video_id: $v, comment_id: .id, replied: false, published_at: .snippet.topLevelComment.snippet.publishedAt}]' \
              raw.json > new.json

            jq -s 'add' pending.json new.json > combined.json
            mv combined.json pending.json
          done

          UNREPLIED=$(jq '[.[] | select(.replied == false)] | length' pending.json)
          echo "has_comments=$UNREPLIED" >> "$GITHUB_OUTPUT"
          echo "Found $UNREPLIED unreplied comment(s)."

      - name: Upload pending comments
        if: steps.fetch.outputs.has_comments != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pending-comments
          path: pending.json

  reply-comments:
    needs: fetch-comments
    if: needs.fetch-comments.outputs.has_comments != '0'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tubectl
        run: go build -o tubectl .

      - name: Restore OAuth token
        run: |
          mkdir -p ~/.tubectl/auth
          echo "${{ secrets.TUBECTL_TOKEN }}" | base64 -d --ignore-garbage > ~/.tubectl/auth/youtube.json
          chmod 600 ~/.tubectl/auth/youtube.json

      - name: Download pending comments
        uses: actions/download-artifact@v4
        with:
          name: pending-comments

      - name: Reply to pending comments
        run: |
          UNREPLIED=$(jq -r '.[] | select(.replied == false) | "\(.video_id) \(.comment_id)"' pending.json)

          if [ -z "$UNREPLIED" ]; then
            echo "All comments already replied."
            exit 0
          fi

          while read -r video_id comment_id; do
            echo "Replying to comment: $comment_id (video: $video_id)"

            if ./tubectl bot answer-comment \
              --video-id "$video_id" \
              --comment-id "$comment_id" \
              --auto-approve \
              --prompt-name ${{env.DEFAULT_SYSTEM_PROMPT_NAME}}; then
              jq --arg cid "$comment_id" \
                '(.[] | select(.comment_id == $cid) | .replied) = true' \
                pending.json > updated.json
              mv updated.json pending.json
            else
              echo "WARNING: failed to reply to $comment_id, continuing..."
            fi
          done <<< "$UNREPLIED"

          TOTAL=$(jq 'length' pending.json)
          DONE=$(jq '[.[] | select(.replied == true)] | length' pending.json)
          echo "Replied to $DONE / $TOTAL pending comments."

